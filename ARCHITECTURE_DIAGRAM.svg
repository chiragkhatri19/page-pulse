<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Page Pulse scale architecture</title>
  <desc id="desc">A production architecture for Page Pulse showing edge protection, API replicas, Redis state, worker queues, durable storage, target websites, observability, and rollback controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="0.48" stop-color="#eef3ef"/>
      <stop offset="1" stop-color="#f3eee5"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2a24" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2f3a34"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .frame { fill: #fffaf0; stroke: #24312a; stroke-width: 1.4; }
      .card { fill: #fffdf6; stroke: #24312a; stroke-width: 1.35; filter: url(#softShadow); }
      .state { fill: #ecf6ef; }
      .risk { fill: #fff0df; }
      .obs { fill: #edf2ff; }
      .title { font: 700 54px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #16221c; letter-spacing: 0; }
      .subtitle { font: 500 19px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #53645a; letter-spacing: 0; }
      .label { font: 800 22px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #16221c; letter-spacing: 0; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #46564d; letter-spacing: 0; }
      .tiny { font: 700 12px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #6a786f; letter-spacing: 1px; }
      .num { font: 800 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #16221c; }
      .line { fill: none; stroke: #2f3a34; stroke-width: 2.2; marker-end: url(#arrow); }
      .softLine { fill: none; stroke: #67756c; stroke-width: 1.7; stroke-dasharray: 7 8; marker-end: url(#arrow); }
      .badge { fill: #1b2a22; }
      .badgeText { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial; fill: #fffaf0; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="920"/>
  <rect x="26" y="26" width="1388" height="868" rx="34" class="frame" opacity="0.94"/>
  <rect width="1440" height="920" filter="url(#grain)" opacity="0.55"/>

  <text x="74" y="92" class="tiny">PAGEPULSE.RUN / TASK B</text>
  <text x="74" y="154" class="title">Production architecture for bursty URL audits</text>
  <text x="76" y="190" class="subtitle">Synchronous for cache hits and fast origins. Converts slow origins to queued work without breaking the SLA.</text>

  <g transform="translate(76 250)">
    <rect width="180" height="118" rx="18" class="card"/>
    <text x="24" y="42" class="label">Client</text>
    <text x="24" y="72" class="small">Browser, API user</text>
    <text x="24" y="96" class="small">or scheduled audit</text>
  </g>

  <g transform="translate(296 250)">
    <rect width="200" height="118" rx="18" class="card risk"/>
    <text x="24" y="42" class="label">Edge</text>
    <text x="24" y="72" class="small">TLS, WAF, IP limits</text>
    <text x="24" y="96" class="small">and CDN cache</text>
  </g>

  <g transform="translate(548 230)">
    <rect width="252" height="158" rx="20" class="card"/>
    <text x="26" y="45" class="label">API replicas</text>
    <text x="26" y="78" class="small">Validate URL, SSRF guard</text>
    <text x="26" y="102" class="small">rate limit, cache lookup</text>
    <text x="26" y="126" class="small">5 s sync deadline</text>
  </g>

  <g transform="translate(856 230)">
    <rect width="230" height="158" rx="20" class="card state"/>
    <text x="26" y="45" class="label">Redis state</text>
    <text x="26" y="78" class="small">Report cache + TTL</text>
    <text x="26" y="102" class="small">token buckets</text>
    <text x="26" y="126" class="small">single-flight locks</text>
  </g>

  <g transform="translate(1140 230)">
    <rect width="224" height="158" rx="20" class="card risk"/>
    <text x="26" y="45" class="label">Target sites</text>
    <text x="26" y="78" class="small">Outbound HTTPS only</text>
    <text x="26" y="102" class="small">DNS-pinned fetches</text>
    <text x="26" y="126" class="small">host-level bulkheads</text>
  </g>

  <path class="line" d="M256 309 H296"/>
  <path class="line" d="M496 309 H548"/>
  <path class="line" d="M800 309 H856"/>
  <path class="line" d="M1086 309 H1140"/>

  <g transform="translate(548 470)">
    <rect width="252" height="144" rx="20" class="card state"/>
    <text x="26" y="44" class="label">Queue lane</text>
    <text x="26" y="76" class="small">BullMQ / Redis Streams</text>
    <text x="26" y="100" class="small">interactive, scheduled, bulk</text>
    <text x="26" y="124" class="small">bounded backlog + DLQ</text>
  </g>

  <g transform="translate(856 470)">
    <rect width="230" height="144" rx="20" class="card"/>
    <text x="26" y="44" class="label">Workers</text>
    <text x="26" y="76" class="small">Same audit core</text>
    <text x="26" y="100" class="small">30 s budget, retries</text>
    <text x="26" y="124" class="small">webhooks on finish</text>
  </g>

  <g transform="translate(1140 470)">
    <rect width="224" height="144" rx="20" class="card state"/>
    <text x="26" y="44" class="label">Postgres</text>
    <text x="26" y="76" class="small">Audit history</text>
    <text x="26" y="100" class="small">API keys and usage</text>
    <text x="26" y="124" class="small">billing-safe records</text>
  </g>

  <path class="line" d="M674 388 V470"/>
  <path class="line" d="M800 542 H856"/>
  <path class="line" d="M1086 542 H1140"/>
  <path class="line" d="M971 470 V388"/>
  <path class="line" d="M971 470 C1030 430 1086 388 1140 350"/>

  <g transform="translate(76 676)">
    <rect width="354" height="136" rx="20" class="card obs"/>
    <text x="26" y="44" class="label">Observability</text>
    <text x="26" y="77" class="small">OpenTelemetry to metrics, logs and traces</text>
    <text x="26" y="103" class="small">Alerts on SLA, queue age, Redis, SSRF probes</text>
  </g>

  <g transform="translate(474 676)">
    <rect width="394" height="136" rx="20" class="card risk"/>
    <text x="26" y="44" class="label">SLA policy</text>
    <text x="26" y="77" class="small">Cache hit p99 &lt; 150 ms. Fast miss p95 &lt; 3 s.</text>
    <text x="26" y="103" class="small">Slow origin returns 202 quickly and finishes async.</text>
  </g>

  <g transform="translate(912 676)">
    <rect width="452" height="136" rx="20" class="card"/>
    <text x="26" y="44" class="label">Release safety</text>
    <text x="26" y="77" class="small">Immutable image tags, canary rollout, previous-SHA rollback</text>
    <text x="26" y="103" class="small">Versioned cache and queue messages keep rollback possible.</text>
  </g>

  <path class="softLine" d="M674 388 C520 472 364 592 253 676"/>
  <path class="softLine" d="M674 388 C666 492 666 588 670 676"/>
  <path class="softLine" d="M971 388 C995 506 1064 598 1138 676"/>

  <g transform="translate(76 842)">
    <rect class="badge" x="0" y="-28" width="250" height="38" rx="19"/>
    <text x="20" y="-4" class="badgeText">Built for Digital Heroes Training Task</text>
    <text x="1110" y="-4" class="tiny">10K AUDITS/DAY • 500 CONCURRENT BURST • CUSTOMER-FACING SLA</text>
  </g>
</svg>
