name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t page-pulse:ci .

      - name: Start container
        run: |
          docker run -d --name page-pulse -p 3000:3000 \
            -e LOG_LEVEL=warn -e RATE_LIMIT_MAX=100 page-pulse:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "service never became healthy"; docker logs page-pulse; exit 1

      - name: Audit a real URL end to end
        run: |
          body=$(curl -fsS -X POST http://localhost:3000/v1/audit \
            -H 'content-type: application/json' \
            -d '{"url":"https://example.com"}')
          echo "$body" | head -c 400
          echo "$body" | grep -q '"overall"' || { echo "no score in response"; exit 1; }

      - name: Verify the cache serves the repeat request
        run: |
          curl -fsS -X POST http://localhost:3000/v1/audit \
            -H 'content-type: application/json' -d '{"url":"https://example.com"}' > /dev/null
          header=$(curl -fsS -D - -o /dev/null -X POST http://localhost:3000/v1/audit \
            -H 'content-type: application/json' -d '{"url":"https://example.com"}' \
            | grep -i '^x-cache:' | tr -d '\r')
          echo "$header"
          echo "$header" | grep -qi 'HIT' || { echo "expected a cache HIT"; exit 1; }

      - name: Verify the SSRF guard rejects link-local targets
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/v1/audit \
            -H 'content-type: application/json' \
            -d '{"url":"http://169.254.169.254/latest/meta-data/"}')
          echo "status=$code"
          [ "$code" = "422" ] || { echo "SSRF guard did not reject"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs page-pulse

      - name: Tear down
        if: always()
        run: docker rm -f page-pulse || true
